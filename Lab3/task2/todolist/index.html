<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header class="header">
            <h1>ToDo List</h1>
    </header>
        <main class = "container">
            <form id ="toform" class = "toform">
                <label for="toinput"> ToDo List</label>
                <div class="input">
                    <input type="text" id="toinput" placeholder="New Task" 
                    required >
                    <button type="submit">Add</button>
                    <div class="todo-controls">
                        <button id="delete-selected" class="delete-selected-btn">Delete Selected</button>
                    </div>
                    
                </div>
            </form>
            <ul id="tolist" class="tolist">
            </ul>
        </main>
<script src="sc.js"></script>
</body>
</html>
